# -----------------------------------------------------------------------------
# DMS On-Prem Docker Compose
#
# Staggered Deploy (NO spike) – run INI instead of `docker compose up --build`:
#   1) docker compose build mysql caddy
#   2) docker compose build backend
#   3) docker compose build frontend
#   4) docker compose up -d
#
# Or shorter, BuildKit 1-job parallelism:
#   DOCKER_BUILDKIT=1 BUILDKIT_PROGRESS=plain docker compose build \
#       --parallelism 1 --progress=plain
#   docker compose up -d
# -----------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: dms-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=512M
      - --innodb-flush-method=O_DIRECT
      - --max_connections=150
      - --performance-schema=OFF
    mem_limit: 1536m
    mem_reservation: 768m
    cpus: "1.5"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - dms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dms-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    shm_size: "1gb"
    mem_limit: 2560m
    mem_reservation: 1280m
    cpus: "2.0"
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: --max-old-space-size=1536 --optimize-for-size
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?connection_limit=10&pool_timeout=10
      PRISMA_CLIENT_ENGINE_TYPE: library
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: ./uploads
      RUN_SEED: ${RUN_SEED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_DEFAULT_LANGUAGE: ${AI_DEFAULT_LANGUAGE:-en}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_USER: ${SMTP_USERNAME:-}
      EMAIL_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${SMTP_FROM:-}
      CHROME_BIN: /usr/bin/chromium
      LIBREOFFICE_BIN: /usr/bin/soffice
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      TZ: Asia/Kuala_Lumpur
    volumes:
      - dms_uploads:/app/uploads
      - dms_backups:/app/backups
    networks:
      - dms-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').request({method:'GET',host:'127.0.0.1',port:4000,path:'/healthz',timeout:2000},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end()"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    expose:
      - "80"
    volumes:
      - dms_uploads:/usr/share/nginx/uploads:ro
    networks:
      - dms-net

  caddy:
    build:
      context: ./deploy/docker/caddy
      dockerfile: Dockerfile
    container_name: dms-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TZ: Asia/Kuala_Lumpur
      TLS_MODE: ${TLS_MODE:-auto}
      DMS_PUBLIC_URLS: ${DMS_PUBLIC_URLS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/docker/caddy/tls:/etc/caddy/tls:ro
    networks:
      - dms-net

volumes:
  dms_mysql_data:
    driver: local
  dms_uploads:
    driver: local
  dms_backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  dms-net:
    driver: bridge
